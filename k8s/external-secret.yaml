apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: allegro-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: allegro-service-secret
    creationPolicy: Owner
  data:
    - secretKey: ALLEGRO_CLIENT_SECRET
      remoteRef:
        key: secret/prod/allegro-service
        property: ALLEGRO_CLIENT_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/allegro-service
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/allegro-service
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/allegro-service
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/allegro-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/allegro-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/allegro-service
        property: PAYMENT_WEBHOOK_API_KEY

    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: JWT_TOKEN
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: WAREHOUSE_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: ORDERS_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: CATALOG_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # path as CREDENTIAL_INGEST_TOKEN. Do NOT share monitoring's
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: CREDENTIAL_INGEST_TOKEN
